<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Set your password · ReShape</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f7f4ef;--s1:#fff;--s3:#f1ece4;--border:#e5ddd1;
    --text:#2a2724;--text3:#8a8178;--orange:#ed5c25;--orange2:#d44e1c;
    --red:#d64545;--green:#2e9e5b;
    --head:'Georgia',serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--text);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:40px;
       max-width:400px;width:100%;text-align:center;box-shadow:0 24px 80px rgba(42,39,36,.12)}
  .title{font-family:var(--head);font-size:24px;font-weight:900;margin-bottom:6px;letter-spacing:-.03em}
  .title span{color:var(--orange)}
  .sub{font-size:13px;color:var(--text3);margin-bottom:24px;line-height:1.5}
  .input{width:100%;background:var(--s3);border:1.5px solid var(--border);border-radius:10px;
         color:var(--text);padding:12px 16px;font-family:var(--body);font-size:14px;outline:none;
         margin-bottom:12px;transition:border-color .2s}
  .input:focus{border-color:var(--orange)}
  .btn{width:100%;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:10px;
       font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer;transition:background .2s}
  .btn:hover{background:var(--orange2)}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{font-size:13px;margin-top:14px;display:none;line-height:1.5}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}
  .hint{font-size:12px;color:var(--text3);margin-top:18px;line-height:1.5}
  .hint a{color:var(--orange);text-decoration:underline}
  #loading{font-size:13px;color:var(--text3)}
</style>
</head>
<body>
<div class="box">
  <div class="title">Re<span>Shape</span></div>

  <div id="loading">
    <div class="sub" style="margin-bottom:0">Checking your link…</div>
  </div>

  <div id="form" style="display:none">
    <div class="sub">Choose a password for your dashboard account.</div>
    <input type="password" class="input" id="pw" placeholder="New password" autocomplete="new-password" minlength="8">
    <input type="password" class="input" id="pw2" placeholder="Confirm password" autocomplete="new-password" minlength="8">
    <button class="btn" id="btn" onclick="savePassword()">Set password</button>
    <div class="msg err" id="err"></div>
  </div>

  <div id="done" style="display:none">
    <div class="msg ok" style="display:block">Password set. Redirecting you to the dashboard…</div>
  </div>

  <div id="bad" style="display:none">
    <div class="sub">This link is invalid or has expired.</div>
    <div class="hint">Ask an admin to send you a fresh invite from the dashboard, or use
      <a href="/dashboard.html">the sign-in page</a> if you already have a password.</div>
  </div>
</div>

<script>
  var SUPABASE_URL = 'https://lvizldmdficsfpgegehp.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2aXpsZG1kZmljc2ZwZ2VnZWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTk4NDQsImV4cCI6MjA4OTI3NTg0NH0.72wHbZaTvqNzW6DTb6Ae1vi9QpOg_-KiEO-Jjm9mn0k';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function show(id){
    ['loading','form','done','bad'].forEach(function(x){
      document.getElementById(x).style.display = (x === id) ? 'block' : 'none';
    });
  }

  // The invite/recovery link lands here with the session in the URL hash.
  // supabase-js parses it automatically; we just wait for a session to appear.
  var settled = false;
  function gotSession(){ if(settled) return; settled = true; show('form'); }

  sb.auth.onAuthStateChange(function(_event, session){ if(session) gotSession(); });

  (async function(){
    // Surface an explicit error returned in the URL (e.g. expired link).
    var hash = (window.location.hash || '').replace(/^#/, '');
    if (/error/.test(hash) && !/access_token/.test(hash)) { show('bad'); settled = true; return; }

    var res = await sb.auth.getSession();
    if (res.data && res.data.session) { gotSession(); return; }

    // Give detectSessionInUrl a beat to exchange the token, then decide.
    setTimeout(async function(){
      if (settled) return;
      var r = await sb.auth.getSession();
      if (r.data && r.data.session) gotSession();
      else show('bad');
    }, 1200);
  })();

  async function savePassword(){
    var pw  = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;
    var err = document.getElementById('err');
    var btn = document.getElementById('btn');
    err.style.display = 'none';

    if (pw.length < 8){ err.textContent = 'Password must be at least 8 characters.'; err.style.display='block'; return; }
    if (pw !== pw2){ err.textContent = 'Passwords do not match.'; err.style.display='block'; return; }

    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var out = await sb.auth.updateUser({ password: pw });
      if (out.error){
        err.textContent = out.error.message || 'Could not set password.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Set password';
        return;
      }
      show('done');
      setTimeout(function(){ window.location.href = '/dashboard.html'; }, 1800);
    } catch(e){
      err.textContent = 'Something went wrong. Please try again.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Set password';
    }
  }

  document.getElementById('pw2').addEventListener('keydown', function(e){
    if (e.key === 'Enter') savePassword();
  });
</script>
</body>
</html>
